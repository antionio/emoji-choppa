
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Emoji Choppa</title></head>
<body style="margin:0;background:#0b1020">
<div style="
  position:absolute;
  top:10px;
  left:10px;
  background:rgba(0,0,0,0.7);
  color:white;
  padding:10px;
  border-radius:8px;
  font-family:sans-serif;
">
<div style="margin-bottom:10px;">
<b>Controls</b><br>
↑ Lift<br>
← → Move sideways<br>
Collect 🧍 to score points
</div>
  <div>
    Gravity:
    <span id="gravityVal">0.30</span><br>
    <input id="gravity" type="range" min="0" max="1" step="0.01" value="0.3">
  </div>

  <div>
    Lift:
    <span id="liftVal">0.80</span><br>
    <input id="lift" type="range" min="0" max="2" step="0.01" value="0.8">
  </div>

  <div>
    Side thrust:
    <span id="sideVal">0.40</span><br>
    <input id="side" type="range" min="0" max="2" step="0.01" value="0.4">
  </div>

  <div>
    Friction:
    <span id="frictionVal">0.98</span><br>
    <input id="friction" type="range" min="0.8" max="1" step="0.001" value="0.98">
  </div>

<button onclick="resetGame()" style="
margin-top:10px;
width:100%;
padding:6px;
">
Reset Game
</button>
</div>
<canvas id="c" width="960" height="540"></canvas>
<script>
const params = {
  gravity: 0.3,
  lift: 0.8,
  sideThrust: 0.4,
  friction: 0.98
};

function bindSlider(id, prop, digits = 2) {
  const slider = document.getElementById(id);
  const label = document.getElementById(id + 'Val');

  slider.oninput = () => {
    params[prop] = parseFloat(slider.value);
    label.textContent = params[prop].toFixed(digits);
  };
}

bindSlider('gravity', 'gravity');
bindSlider('lift', 'lift');
bindSlider('side', 'sideThrust');
bindSlider('friction', 'friction', 3);
  
const c = document.getElementById('c');
const ctx = c.getContext('2d');
ctx.font = '48px sans-serif';
ctx.fillStyle = 'white';

let x, y, vx, vy, score, people;

function resetGame() {
  x = 480;
  y = 100;
  vx = 0;
  vy = 0;
  score = 0;

  people = [];

  for (let i = 0; i < 5; i++) {
    people.push({
      x: Math.random() * 900,
      y: 500
    });
  }
}
resetGame();

const keys = {};
onkeydown = e => { keys[e.key] = true; if (e.key.startsWith('Arrow')) e.preventDefault(); };
onkeyup = e => keys[e.key] = false;

function loop() {
  ctx.clearRect(0, 0, 960, 540);

  vy += params.gravity;
  
  if (keys['ArrowUp'])
    vy -= params.lift;
  
  if (keys['ArrowLeft'])
    vx -= params.sideThrust;
  
  if (keys['ArrowRight'])
    vx += params.sideThrust;
  
  vx *= params.friction;
  
  x = x + vx;
  y = y + vy;
  if (y > 500) { y = 500; vy = 0; }
  if (x < 0) x = 960;
  if (x > 960) x = 0;

  people = people.filter(p => {
    const hit = Math.abs(p.x - x) < 40 && Math.abs(p.y - y) < 40;
    if (hit) score = score + 1;
    return !hit;
  });

  people.forEach(p => ctx.fillText('🧍', p.x, p.y));
  ctx.fillText('🚁', x, y);
  ctx.fillText(score, 20, 60);

  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
