<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Mini Choppa</title></head>
<body style="margin:0;background:#0b1020">
<canvas id="c" width="960" height="540"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
ctx.font = '48px sans-serif';
ctx.fillStyle = 'white';

let x = 480, y = 100, vx = 0, vy = 0, score = 0;
let people = [];
for (let i = 0; i < 5; i++) {
  people.push({ x: Math.random() * 900, y: 500 });
}

const keys = {};
onkeydown = e => { keys[e.key] = true; if (e.key.startsWith('Arrow')) e.preventDefault(); };
onkeyup = e => keys[e.key] = false;

function loop() {
  ctx.clearRect(0, 0, 960, 540);

  vy = vy + 0.3;
  if (keys['ArrowUp']) vy = vy - 0.8;
  if (keys['ArrowLeft']) vx = vx - 0.4;
  if (keys['ArrowRight']) vx = vx + 0.4;
  vx = vx * 0.98;
  x = x + vx;
  y = y + vy;
  if (y > 500) { y = 500; vy = 0; }
  if (x < 0) x = 960;
  if (x > 960) x = 0;

  people = people.filter(p => {
    const hit = Math.abs(p.x - x) < 40 && Math.abs(p.y - y) < 40;
    if (hit) score = score + 1;
    return !hit;
  });

  people.forEach(p => ctx.fillText('🧍', p.x, p.y));
  ctx.fillText('🚁', x, y);
  ctx.fillText(score, 20, 60);

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
